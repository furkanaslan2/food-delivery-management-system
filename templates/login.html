<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Girişi | YeSende</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <style>
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #111827 0%, #312e81 100%); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box;
        }
        
        .brand-logo { 
            margin-bottom: 30px; 
            text-align: center; 
        }
        
        .brand-logo img {
            height: 70px; 
            object-fit: contain;
        }

        .auth-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 420px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
            box-sizing: border-box; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .auth-card h2 { margin: 0 0 8px 0; font-size: 26px; color: #111827; text-align: center; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: #6b7280; font-size: 15px; margin: 0 0 30px 0; font-weight: 500; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #374151; margin-bottom: 8px; font-weight: 600; }
        .form-control { 
            width: 100%; 
            padding: 14px 16px; 
            font-size: 15px; 
            border: 1px solid #d1d5db; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: inherit; 
            outline: none;
            background-color: #f9fafb;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
            will-change: box-shadow;
            transform: translateZ(0);
        }
        .form-control:focus { background-color: #ffffff; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            background-color: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: inherit; 
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform, box-shadow;
            transform: translateZ(0);
        }
        .submit-btn:hover { 
            background-color: #4338ca; 
            transform: translateY(-2px) translateZ(0); 
            box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); 
        }
        
        .bottom-text { margin-top: 25px; text-align: center; font-size: 14px; color: #6b7280; font-weight: 500; }
        .bottom-text a { color: #4f46e5; text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .bottom-text a:hover { color: #312e81; text-decoration: underline; }
        
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <a href="/" class="brand-logo">
        <img src="{{ url_for('static', filename='images/icons/logo.svg') }}" alt="YeSende">
    </a>

    <div class="auth-card">
        <h2>Yönetim Paneli</h2>
        <p class="subtitle">İş ortaklarımıza özel yönetim sistemine hoş geldiniz.</p>

        <form id="login-form" action="{{ url_for('login') }}" method="POST" novalidate>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="ornek@restoran.com">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="password" style="margin-bottom: 0;">Şifre</label>
                    <a href="{{ url_for('forgot_password_admin') }}" style="font-size: 13px; color: #4f46e5; font-weight: 600; text-decoration: none; transition: color 0.2s;">Şifremi Unuttum</a>
                </div>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn">Sisteme Giriş Yap</button>
        </form>
        
        <div class="bottom-text">
            Henüz iş ortağımız değil misiniz? <a href="{{ url_for('register') }}">Başvuru Yapın</a>
        </div>
    </div>

    <div id="flash-messages-container" style="display: none;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <span class="flash-message-data" data-category="{{ category }}" data-message="{{ message }}"></span>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const loginForm = document.getElementById('login-form');
        
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                let hasError = false;
                let errorMessage = "";

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!email || !emailRegex.test(email)) {
                    hasError = true;
                    errorMessage = "Lütfen sisteme kayıtlı, geçerli bir e-posta adresi girin.";
                } else if (!password) {
                    hasError = true;
                    errorMessage = "Lütfen şifrenizi girin.";
                }

                // ❌ HATA VARSA: Formu durdur ve şık bildirim (Toast) göster
                if (hasError) {
                    e.preventDefault();
                    // Eğer sayfanın altında Toast fonksiyonu tanımlıysa onu çağır
                    if (typeof window.showToast === 'function') {
                        window.showToast(errorMessage, "error");
                    } else {
                        alert(errorMessage);
                    }
                    return false;
                }
                
                // ✅ HATA YOKSA: Form sorunsuzca Python'a (Login'e) gider
            });
        }
    });
    </script>
</body>
</html>
