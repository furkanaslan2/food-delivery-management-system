<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Restaurant Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    
    <style>
        /* Genel Sayfa Ayarları */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Modern yumuşak gri */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Beyaz Giriş Kartı */
        .modern-auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); /* Soft gölge */
            box-sizing: border-box;
        }

        /* Başlıklar */
        .modern-auth-container h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 26px;
            color: #111827;
            text-align: center;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form Elemanları */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #374151;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            font-family: inherit;
            background-color: #fff;
        }

        /* Input ve Select Tıklanınca (Focus) */
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Giriş Butonu */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5; /* Modern İndigo */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
            font-family: inherit;
        }

        .submit-btn:hover {
            background-color: #4338ca;
        }

        /* Alt Link Kısmı */
        .bottom-text {
            margin-top: 25px;
            text-align: center;
            font-size: 13.5px;
            color: #6b7280;
        }

        .bottom-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .bottom-text a:hover {
            color: #3730a3;
            text-decoration: underline;
        }

        /* Uyarı Mesajları (Flash) */
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .alert-danger { background-color: #fee2e2; color: #991b1b; }
        .alert-success { background-color: #d1fae5; color: #065f46; }
        .alert-warning { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div class="modern-auth-container">
        <h2>System Login</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="role">Select Role</label>
                <select name="role" id="role" required>
                    <option value="user">Restaurant Owner (User)</option>
                    <option value="waiter">Waiter</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>
        
        <div class="bottom-text">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>

    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    {{ message }}
                    <button class="close-flash" onclick="this.parentElement.style.display='none';">&times;</button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
