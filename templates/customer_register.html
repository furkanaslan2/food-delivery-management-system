<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | YeSende</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #111827 0%, #312e81 100%); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box;
        }
        
        .brand-logo { 
            margin-bottom: 30px; 
            text-align: center; 
        }
        
        .brand-logo img {
            height: 70px; 
            object-fit: contain;
        }

        .auth-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 450px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
            box-sizing: border-box; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .auth-card h2 { margin: 0 0 8px 0; font-size: 26px; color: #111827; text-align: center; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: #6b7280; font-size: 15px; margin: 0 0 30px 0; font-weight: 500; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #374151; margin-bottom: 8px; font-weight: 600; }
        .form-control { 
            width: 100%; 
            padding: 14px 16px; 
            font-size: 15px; 
            border: 1px solid #d1d5db; 
            border-radius: 12px; 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
            font-family: inherit; 
            outline: none;
            background-color: #f9fafb;
        }
        .form-control:focus { background-color: #ffffff; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            background-color: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 10px; 
            font-family: inherit; 
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        .submit-btn:hover { background-color: #4338ca; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); }
        
        .bottom-text { margin-top: 25px; text-align: center; font-size: 14px; color: #6b7280; font-weight: 500; }
        .bottom-text a { color: #4f46e5; text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .bottom-text a:hover { color: #312e81; text-decoration: underline; }
        
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    
    <a href="/" class="brand-logo">
        <img src="{{ url_for('static', filename='images/icons/logo.svg') }}" alt="YeSende">
    </a>

    <div class="auth-card">
        <h2>Aramıza Katıl</h2>
        <p class="subtitle">Lezzet dolu bir dünyaya adım at.</p>

        <form id="customer-register-form" action="{{ url_for('customer_register') }}" method="POST" novalidate>
            <div class="form-group">
                <label for="name">Ad Soyad</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Örn: Ahmet Yılmaz">
            </div>
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="ornek@mail.com">
            </div>
            <div class="form-group">
                <label for="password">Şifre Belirle</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn">Kayıt Ol ve Başla</button>
        </form>
        
        <div class="bottom-text">
            Zaten bir hesabın var mı? <a href="{{ url_for('customer_login') }}">Giriş Yap</a>
        </div>
    </div>

    <div id="flash-messages-container" style="display: none;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <span class="flash-message-data" data-category="{{ category }}" data-message="{{ message }}"></span>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const registerForm = document.getElementById('customer-register-form');
        
        if (registerForm) {
            registerForm.addEventListener('submit', function(e) {
                let hasError = false;
                let errorMessage = "";

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).{8,}$/;

                if (!name) {
                    hasError = true;
                    errorMessage = "Lütfen adınızı ve soyadınızı girin.";
                } else if (!email || !emailRegex.test(email)) {
                    hasError = true;
                    errorMessage = "Lütfen geçerli bir e-posta adresi girin.";
                } else if (!password) {
                    hasError = true;
                    errorMessage = "Lütfen hesabınız için bir şifre belirleyin.";
                } else if (!passwordRegex.test(password)) { 
                    hasError = true;
                    errorMessage = "Şifreniz en az 8 karakter olmalı; en az 1 büyük harf, 1 küçük harf ve 1 rakam içermelidir.";
                }

                if (hasError) {
                    e.preventDefault();
                    if (typeof window.showToast === 'function') {
                        window.showToast(errorMessage, "error");
                    } else {
                        alert(errorMessage);
                    }
                    return false;
                }
                
                // ✅ HATA YOKSA: Form sorunsuzca Python'a (Kayıt işlemine) gider
            });
        }
    });

    // ==========================================
    // 🚀 E-POSTA CANLI KONTROL SİSTEMİ (AJAX)
    // ==========================================
    document.addEventListener("DOMContentLoaded", function() {
        const emailInput = document.getElementById('email');
        if (!emailInput) return;

        const emailWarning = document.createElement('span');
        emailWarning.style.fontSize = '12px';
        emailWarning.style.fontWeight = '600';
        emailWarning.style.marginTop = '5px';
        emailWarning.style.display = 'block';
        emailInput.parentNode.insertBefore(emailWarning, emailInput.nextSibling);

        emailInput.addEventListener('blur', function() {
            const email = this.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email && emailRegex.test(email)) {
                fetch('/api/check_email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, type: 'customer' }) 
                })
                .then(res => res.json())
                .then(data => {
                    if (data.available === false) {
                        emailInput.style.borderColor = '#ef4444';
                        emailInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
                        emailWarning.innerHTML = '<i class="ph-bold ph-x-circle"></i> Bu e-posta adresi zaten kullanımda!';
                        emailWarning.style.color = '#ef4444';
                    } else {
                        emailInput.style.borderColor = '#10b981';
                        emailInput.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.2)';
                        emailWarning.innerHTML = '<i class="ph-bold ph-check-circle"></i> Bu e-posta kullanılabilir.';
                        emailWarning.style.color = '#10b981';
                    }
                }).catch(err => console.log('Mail kontrol hatası:', err));
            } else {
                emailInput.style.borderColor = '';
                emailInput.style.boxShadow = '';
                emailWarning.innerText = '';
            }
        });
    });
    </script>
</body>
</html>
